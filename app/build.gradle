plugins {
    id 'com.android.application'
    id 'kotlin-android'
}
Properties properties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}



apply plugin: 'kotlin-android'

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.estebanmiretti.gps"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [MAPS_API_KEY: properties.getProperty('MAPS_API_KEY', '')]

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.estebanmiretti.gps'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'

    //implementation project(':libs:polygon-contains-point-master')
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    //implementation 'com.squareup.retrofit2:converter-jaxb:2.9.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-simplexml:2.9.0'
    //implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // (Java only)
    implementation("androidx.work:work-runtime:2.8.0")

    // Kotlin + coroutines
    //implementation("androidx.work:work-runtime-ktx:2.8.0")

    // optional - RxJava2 support
    implementation("androidx.work:work-rxjava2:2.8.0")

    // optional - GCMNetworkManager support
    implementation("androidx.work:work-gcm:2.8.0")

    // optional - Test helpers
    androidTestImplementation("androidx.work:work-testing:2.8.0")

    // optional - Multiprocess support
    implementation "androidx.work:work-multiprocess:2.8.0"
    implementation "androidx.core:core-ktx:1.9.0"
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.work:work-runtime-ktx:2.9.0" // O la versión que uses, pero terminada en -ktx
}
repositories {
    mavenCentral()
}